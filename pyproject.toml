[project]
name = "python-backend-foundation"
version = "0.1.0"
description = "A reusable, modular Python backend foundation."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.143.0,<0.144.0",
    "pydantic>=2.14.0,<3",
    "pydantic-settings>=2.15.0,<3",
    "uvicorn[standard]>=0.54.0,<1",
]

[project.scripts]
backend-dev = "python_backend_foundation.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.16.10,<0.17",
    "ty==0.0.85",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
